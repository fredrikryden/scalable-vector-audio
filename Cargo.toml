# Concern: declares the resolver, the members, the version every crate inherits, the JSON parser and libm | Non-concern: a crate's other dependencies, deny edges (.annotated-tree.toml) | IO: none
[workspace]
resolver = "2"
members = [
    "crates/sva-ast",
    "crates/sva-formula",
    "crates/sva-samples",
    "crates/sva-engine",
    "crates/sva-core",
    "crates/sva-solve",
    "crates/sva-cli",
    "crates/sva-wasm",
]

[workspace.package]
version = "0.18.0"
license = "MIT"
repository = "https://github.com/fredrikryden/scalable-vector-audio"
edition = "2024"

# cargo publish needs a version on each path dep; keep it the one above.
[workspace.dependencies]
sva-ast = { path = "crates/sva-ast", version = "0.18.0" }
sva-formula = { path = "crates/sva-formula", version = "0.18.0" }
sva-samples = { path = "crates/sva-samples", version = "0.18.0" }
sva-engine = { path = "crates/sva-engine", version = "0.18.0" }
sva-core = { path = "crates/sva-core", version = "0.18.0" }
sva-solve = { path = "crates/sva-solve", version = "0.18.0" }
sva-cli = { path = "crates/sva-cli", version = "0.18.0" }
sva-wasm = { path = "crates/sva-wasm", version = "0.18.0" }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
libm = "0.2.16"

[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
