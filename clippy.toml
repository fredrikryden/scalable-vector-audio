    { path = "f64::sin", reason = "platform libm: native and wasm round differently; call libm::sin" },
    { path = "f64::cos", reason = "platform libm: native and wasm round differently; call libm::cos" },
    { path = "f64::tan", reason = "platform libm: native and wasm round differently; call libm::tan" },
