<!-- Concern: lays out the page that crops an opened or recorded sound and reads it with every sample reading | Non-concern: decoding, drawing and analysing (bench.js) | IO: none -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVA Bench</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: light dark; --ink: #1d1d1f; --muted: #6b6b70; --line: #d6d6db; --surface: #ffffff; --mark: #2a5bd7; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ececf0; --muted: #a0a0a8; --line: #3a3a40; --surface: #161618; --mark: #7aa2ff; --bad: #ff8a80; } }
  body { margin: 0 auto; max-width: 1000px; padding: 16px; font: 15px/1.45 system-ui, sans-serif; color: var(--ink); background: var(--surface); }
  p { margin: 6px 0; }
  p:empty { display: none; }
  table { border-collapse: collapse; width: 100%; margin: 6px 0; }
  th, td { text-align: left; vertical-align: top; padding: 4px 8px; border-bottom: 1px solid var(--line); }
  th { font-weight: 600; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .bad { color: var(--bad); }
  .scroll { overflow-x: auto; }
  .stale { opacity: 0.45; }
  body.over canvas { border-color: var(--mark); }
  canvas { display: block; width: 100%; height: 180px; border: 1px solid var(--line); border-radius: 4px; touch-action: none; }
  input[type=number] { font: inherit; width: 7em; font-variant-numeric: tabular-nums; }
  button { font: inherit; padding: 4px 16px; }
</style>
</head>
<body>
<p><input id="file" type="file" accept="audio/*,video/*"> <button id="record">Record</button></p>
<p id="failure" class="bad"></p>
<canvas id="wave"></canvas>
<p><button id="play" disabled>Play</button> <label>Start <input id="start" type="number" min="0" step="0.01" disabled> s</label> <label>Length <input id="length" type="number" min="0" step="0.01" disabled> s</label></p>
<p><button id="run" disabled>Run</button> <button id="download" disabled>Download</button></p>
<div class="scroll"><table id="readings"></table></div>

<script type="module" src="bench.js"></script>
</body>
</html>
